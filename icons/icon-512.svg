<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A56DB" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0E2368" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="100" fill="#F8FAFC"/>
  
  <!-- Shield Body -->
  <path d="M 256 60 
           C 360 60 410 90 410 90 
           C 410 260 360 380 256 440 
           C 152 380 102 260 102 90 
           C 102 90 152 60 256 60 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)" />

  <!-- Inner Gold Accent Shield -->
  <path d="M 256 95 
           C 335 95 375 118 375 118 
           C 375 250 335 348 256 398 
           C 177 348 137 250 137 118 
           C 137 118 177 95 256 95 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- Rupee Symbol Combined with Checkmark & Lock -->
  <!-- Checkmark -->
  <path d="M 200 250 L 240 295 L 320 200" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Indian Rupee Symbol in Center -->
  <text x="256" y="220" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="90" 
        font-weight="bold" 
        fill="#FFFFFF" 
        text-anchor="middle">₹</text>

  <!-- Audio Waves for Voice Guidance -->
  <path d="M 330 330 A 45 45 0 0 1 330 375" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
  <path d="M 345 320 A 65 65 0 0 1 345 385" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>

  <!-- Subtitle Text -->
  <text x="256" y="480" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="2"
        fill="#1E3A8A" 
        text-anchor="middle">SURAKSHA SAATHI</text>
</svg>
